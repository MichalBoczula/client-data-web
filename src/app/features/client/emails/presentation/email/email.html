<mat-card appearance="outlined" class="email-card">
  <mat-card-header>
    <mat-card-title>Email</mat-card-title>
    <mat-card-subtitle>Update the client's email address.</mat-card-subtitle>
  </mat-card-header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading email" />
  }

  <mat-card-content>
    @if (error(); as errorMessage) {
      <p class="error-banner" role="alert">{{ errorMessage }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.hasError('required')) {
          <mat-error>Email is required.</mat-error>
        } @else if (form.controls.email.hasError('email')) {
          <mat-error>Enter a valid email address.</mat-error>
        }
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button type="submit" [disabled]="loading()">Save email</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
