<mat-card appearance="outlined" class="phone-card">
  <mat-card-header>
    <mat-card-title>Phone</mat-card-title>
    <mat-card-subtitle>Update the client's primary phone number.</mat-card-subtitle>
  </mat-card-header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading phone" />
  }

  <mat-card-content>
    @if (error(); as errorMessage) {
      <p class="error-banner" role="alert">{{ errorMessage }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput type="tel" formControlName="phone" autocomplete="tel" />
        @if (form.controls.phone.hasError('required')) {
          <mat-error>Phone is required.</mat-error>
        }
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button type="submit" [disabled]="loading()">Save phone</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
